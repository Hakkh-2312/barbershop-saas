services:
  # ORIGINAL service, left untouched - deployed in Render's default region
  # (Oregon, US West), which turned out to be the main cause of ~1s+
  # latency on every request: the database is in eu-west-1 (Ireland), so
  # every query was crossing the Atlantic and back. Kept running until
  # the Frankfurt service below is verified working, then decommissioned.
  - name: barbershop-saas-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Render does not run dockerCommand through a shell (a bare "a && b"
    # gets passed to "a" as literal argv, not interpreted) - so this runs
    # a real shell script instead. It applies migrations before every boot
    # (a safe no-op if already current) and binds to Render's injected
    # $PORT (defaults to 10000); the Dockerfile's own CMD (hardcoded to
    # 8000, for local docker-compose) is overridden here, not changed.
    dockerCommand: "sh scripts/start.sh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: SENTRY_DSN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TENANT_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: INTERNAL_TASK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: TRIAL_PERIOD_DAYS
        value: "14"

  # NEW service, in Frankfurt - right next to the eu-west-1 database.
  # Render doesn't support changing an existing service's region, so this
  # is a separate resource rather than an edit to the one above. Same
  # config otherwise. All sync:false values need to be re-entered by hand
  # on Render's dashboard (env var values were never in git, and Render
  # doesn't copy them between services) - easiest done by copying each
  # one from the original service's Environment tab.
  - name: barbershop-saas-api-fra
    type: web
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    dockerCommand: "sh scripts/start.sh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: SENTRY_DSN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TENANT_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: INTERNAL_TASK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: TRIAL_PERIOD_DAYS
        value: "14"
